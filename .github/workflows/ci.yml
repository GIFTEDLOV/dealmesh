name: DealMesh CI

on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prove exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Run direct and mocked tests
        shell: bash
        run: |
          evidence_backup="$(mktemp -d)"
          cp artifacts/bradbury-release-manifest.json "$evidence_backup/"
          cp artifacts/dealmesh-final-release-proof.json "$evidence_backup/"
          restore_evidence() {
            cp "$evidence_backup/bradbury-release-manifest.json" artifacts/
            cp "$evidence_backup/dealmesh-final-release-proof.json" artifacts/
          }
          trap restore_evidence EXIT
          python -m pytest tests/direct tests/mocked -q

      - name: Lint and validate contract
        env:
          GENVM_VERSION: v0.3.0-rc7
        run: |
          genvm-lint check contracts/deal_mesh.py
          genvm-lint validate contracts/deal_mesh.py

      - name: Verify source hash and release evidence
        run: |
          python tools/source_hash.py --check
          python tools/verify_release_evidence.py

      - name: Secret scan
        run: python tools/secret_scan.py

      - name: Verify diff and generated state
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prove exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify generated state is clean
        working-directory: frontend
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
